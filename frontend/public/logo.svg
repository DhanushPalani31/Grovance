  <circle cx="60" cy="50" r="5.5" fill="#14B8A6"/>

  <!-- Wordmark: bold, single weight, single primary color — enterprise-clean -->
  <text x="130" y="88" font-family="Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1" fill="#1B2A6B">Grovance</text>
</svg>
