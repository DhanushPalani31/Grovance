<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5A4"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="20" y="20" width="160" height="160" rx="38" fill="url(#badgeGrad)"/>

  <!-- Abstract "G" ring (growth loop) -->
  <path d="M 150 76 A 55 55 0 1 1 148 132"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>

  <!-- Growth arrow / crossbar of the G, pointing up-right -->
  <path d="M 148 132 L 108 132 L 108 112"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 96 122 L 108 108 L 120 118"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Automation / AI circuit nodes trailing along the ring -->
  <circle cx="151" cy="76" r="7" fill="url(#nodeGrad)"/>
  <circle cx="100" cy="58" r="4.5" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="66" cy="78" r="4.5" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="55" cy="112" r="4.5" fill="#FFFFFF" opacity="0.85"/>
  <line x1="151" y1="76" x2="100" y2="58" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="100" y1="58" x2="66" y2="78" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <line x1="66" y1="78" x2="55" y2="112" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="210" y="105" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#1E1B4B">grovance</text>
  <text x="212" y="135" font-family="Helvetica, Arial, sans-serif" font-size="17" letter-spacing="2.5" fill="#0EA5A4">AUTOMATE · INTELLIGENCE · GROW</text>
</svg>
